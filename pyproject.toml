[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam"
version = "0.1.0"
description = "Runtime dependencies for the HPC deployment skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "academy-py>=0.5,<2",
    "fastmcp>=3.4,<5",
    "globus-compute-sdk",
    "parsl",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
# The W&B metrics exporter (`metrics:` profile block) is optional: without
# wandb installed the exporter stays inert, so it is not a runtime dependency.
# Install with `pip install -e .[metrics]` in the environment that runs Hermes.
metrics = ["wandb>=0.16"]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py310"
line-length = 120
# The Hermes runtime template is vendored upstream content, not Loam source.
#
# The Aurora tool-skill scripts are the same category: recipes verified against
# one machine's software stack, written in the idiom of the tool they drive --
# `from openmm import *` is how OpenMM's own documentation uses it. Linting them
# would mean rewriting code whose only warrant is that it was run and passed, so
# the exclusion is per tool category rather than all of skills/:
# skills/hpc-deployment/scripts/ is Loam source and stays linted.
extend-exclude = [
    ".hermes",
    "skills/analysis",
    "skills/diffusion-models",
    "skills/foundation-language-models",
    "skills/inverse-folding",
    "skills/md-simulation",
    "skills/qm",
    "skills/structure-prediction",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
