[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam"
version = "0.1.0"
description = "Runtime dependencies for the HPC deployment skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "academy-py>=0.5,<2",
    "fastmcp>=3.4,<5",
    "globus-compute-sdk",
    "parsl",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
target-version = "py310"
line-length = 120
# The Hermes runtime template is vendored upstream content, not Loam source.
extend-exclude = [".hermes"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
