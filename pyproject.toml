[project]
name = "loam"
version = "0.1.0"
description = "Loam's hypothesis-driven campaign loop on pydantic-ai"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai,anthropic,mcp]>=2.66",
    "pyyaml",
    "httpx",
    # Jnana is imported from tournament.jnana_root; these are its import-time needs
    "requests",
    "jsonschema",
]

[project.scripts]
loam-saturation = "loam.saturation.__main__:main"
loam-inference-pool = "loam.inference_pool:main"

[project.optional-dependencies]
dev = ["pytest"]
# execution.mode: hpc only. The local process starts skills/hpc-deployment's
# mcp_server.py and must import its dependencies.
#
# ensemble-launcher is here for ONE reason: HpcClusterAgent.__init__ builds
# EL's SystemConfig/LauncherConfig, and Academy constructs that agent LOCALLY
# (mcp_server.py launch_cluster) before shipping it to the endpoint.
# hpc_agent.py guards the EL import with try/except ModuleNotFoundError ->
# EL_AVAILABLE, but __init__ does not check that flag, so without EL installed
# here the server dies with `NameError: name 'SystemConfig' is not defined`
# before any job is submitted. Only the base install is needed -- mpi4py lives
# in EL's `hpc` extra and the launcher itself only ever runs on the worker.
hpc = ["fastmcp", "globus-compute-sdk", "academy-py", "ensemble-launcher"]
# Optional `memory:` block. loam runs `hindsight-api` as its own child process
# on the embedded Postgres (pg0), with embeddings and LLM served by remote
# OpenAI-compatible endpoints. hindsight-all is deliberately NOT used: its
# hindsight-api-slim[all] pulls torch/sentence-transformers onto the laptop.
# Pinned exactly: loam sets Hindsight's HINDSIGHT_API_* env vars, which are
# not a stable interface across versions.
# `loam-inference-pool`: routes OpenAI-compatible requests across replicas (loam/inference_pool.py).
inference-pool = ["aiohttp>=3.9"]
memory = ["hindsight-api-slim[embedded-db]==1.2.3", "hindsight-client==1.2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["loam*"]

[tool.setuptools.package-data]
loam = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bare `pytest` imports the checkout it runs in (e.g. a worktree), not whatever
# loam happens to be installed in the venv.
pythonpath = ["."]

[tool.ruff]
# The version CI runs (`uvx ruff@0.14.2 check .`); ruff refuses to run under
# any other. Rule set is ruff's defaults.
required-version = "==0.14.2"
