[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loam"
version = "0.1.0"
description = "Runtime dependencies for the HPC deployment skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "academy-py>=0.5,<2",
    "fastmcp>=3.4,<5",
    "globus-compute-sdk",
    "parsl",
    "pydantic>=2,<3",
]

[tool.setuptools]
py-modules = []
