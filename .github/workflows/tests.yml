name: CPU regression tests
on:
  push:
    branches: [moeen]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.9
      - run: uv sync --locked --extra dev --extra hpc --extra reports
      - run: .venv/bin/python -m pytest -q
        env:
          PYTHONPATH: .:scripts
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MPLCONFIGDIR: /tmp/loam-ci-matplotlib
