version: 1
name: loam-lifecycle
# Canonical, harness-neutral lifecycle mapping. Adapter-specific code maps its
# native callbacks into the JSON payload described below.

wire_protocol:
  stdin: |
    One JSON object. Every payload contains `event` and `repo_root`; active Loam
    profiles additionally provide `workflow_id`, `loam_state_dir`, `loam_run_id`,
    and `loam_execution`, plus `loam_workspace` when the per-hypothesis
    workspace is enabled. Adapters add event-specific fields such as
    `tool_name`, `arguments`, `session_id`, or `child_summary`.
  stdout: |
    Optional JSON object. Empty stdout means no action. Supported portable
    response forms: `{ "action": "block", "message": "..." }` for a
    pre-tool veto and `{ "context": "..." }` for pre-LLM context injection.

hooks:
  pre_tool_call:
    script: hooks/pre-tool.py
    # Blocks on the campaign role boundary and, with loam_workspace, on a
    # code-generator writing outside its run's place in the workspace layout.
    behavior: may_block
  pre_llm_call:
    script: hooks/pre-llm.py
    behavior: may_inject_context
  subagent_start:
    script: hooks/subagent-start.py
    behavior: observe
  subagent_stop:
    script: hooks/subagent-stop.py
    behavior: observe

# In-process seams. Unlike the hooks above these are not spawned scripts: the
# adapter registers a callback that runs inside the harness process. They are
# declared here because this file is where someone looks to learn what Loam can
# do to a running campaign, and a rewrite is the most consequential thing it
# does. Leaving it undeclared made the four `observe`/`may_block` entries above
# read as the whole contract, which understated Loam considerably.
# Tools the adapter registers into the harness. Declared for the same reason as
# the middleware: a tool Loam adds is part of what Loam does to a campaign.
tools:
  loam_dispatch_round:
    toolset: delegation
    handler: dispatch_round
    arguments: none
    why: |
      Launches the round the hook has already planned -- one hypothesis-validator
      per selected hypothesis, or the reasoner once every validator has reported.
      The coordinator calls this instead of composing a `delegate_task` batch,
      which removes the transcription step rather than repairing it afterwards.
      The directive that used to print the ready-to-run array for the model to
      copy now announces what is pending in a few hundred characters; the task
      objects travel in the dispatch.
    dispatch: |
      The handler calls `ctx.dispatch_tool("delegate_task", ...)`, the documented
      plugin path with the parent agent resolved. That reaches the tool registry
      directly, so neither `pre_tool_call` nor the `tool_request` middleware
      fires on the call it makes: no double rewrite, and `tool_policy` cannot
      veto Loam's own dispatch.
    toolset_note: |
      Registered into the existing `delegation` toolset, not a new `loam` one. A
      plugin's own toolset is configurable and OFF until toggled on per
      platform, so a `loam` toolset would leave this invisible to the
      coordinator until someone edited config.

middleware:
  tool_request:
    adapter_callback: canonicalize_campaign_delegation
    behavior: may_rewrite_arguments
    applies_to: delegate_task
    returns: |
      Optional JSON object. `{"args": {...}, "source": "...", "reason": "..."}`
      REPLACES the arguments the model supplied for that call. Empty or absent
      means the model's arguments stand.
    why: |
      The hook computes each round's delegation from persisted state, so the
      authoritative arguments already exist before the model writes anything.
      Asking an LLM to transcribe them was the original design and it failed in
      ways the git history of hypothesis_orchestration.py records (the 2026-10-21
      char-9000 incident, `_hypothesis_block`). This seam replaces
      the transcription with the canonical arguments instead of trusting it.
    ordering: |
      Runs AFTER pre_tool_call, in the same sequential path. A pre_tool_call
      veto therefore PREEMPTS the rewrite -- a blocked call never reaches this
      seam, so a `tool_policy` branch that rejects a malformed delegation
      prevents the repair that would have fixed it silently.
    coverage: |
      `canonical_delegation_args` does not repair every state, which is why the
      `tool_policy` branches still exist. Pinned by
      tests/test_delegation_repair.py:
        - coordinator, fresh round (no validator launched yet) -- REPAIRS
        - a known hypothesis-validator delegating its child    -- REPAIRS
        - coordinator, all validators complete (reasoner due)   -- REPAIRS
        - coordinator, mid-round (validators launched, pending) -- NO REPAIR
      The last row is load-bearing: with no repair available, the veto is the
      only thing standing between a coordinator's substitute batch and
      execution.

# In-process observers Loam registers when a profile opts in. Declared here for
# the same reason as the middleware and tools above: an exporter that reads
# every API call and every tool call is part of what Loam does to a campaign,
# and leaving it undeclared would understate the contract. These are NOT in the
# `hooks:` map because that map is strictly the spawned-script contract (one
# subprocess per event); these run inside the harness process, because they
# fire on the hot path and a subprocess per call is not affordable there.
observability:
  wandb_metrics:
    adapter_callbacks: [pre_tool_call, post_api_request, post_tool_call]
    consumes_lifecycle: [subagent_start, subagent_stop]
    behavior: observe
    activation: |
      Off unless the active profile carries a `metrics: {enabled: true}` block
      (loam_config.MetricsConfig). When off, the two hot-path hooks are never
      even registered, so an unconfigured campaign pays nothing. (pre_tool_call
      is already registered for policy; the exporter only adds a start-time
      stamp to it when metrics are on.)
    records: |
      One Weights & Biases run per campaign (keyed by LOAM_RUN_ID so a walltime
      resume rejoins the same run). Per tool call it records a bundle linking the
      call to the inference that triggered it (matched by api_request_id, else
      the session's last inference): tool wall time (post_tool_call duration_ms),
      the inference's duration (post_api_request api_duration) and token usage,
      and the gap between the inference ending and the tool starting (the tool
      start is stamped at pre_tool_call). Each call is also charged to the skill
      (reviewed recipe) in effect -- the one most recently read in its session
      with skill_view/skills_list -- so tool time can be grouped by skill, not
      only by tool. Tokens are aggregated per agent. Everything lands as per-call
      event rows and cumulative aggregates, plus end-of-run per-agent, per-tool
      and per-skill summary tables. Agent attribution is the subagent role map
      built at subagent_start; an unmapped session is the coordinator, and a call
      before any skill read is charged to "(none)".
    durability: |
      Every event is appended to `<state_dir>/metrics-events.jsonl`, so the
      record survives when W&B is unreachable. In addition, when the
      per-hypothesis workspace is on, each code-generator tool call's bundle is
      written to `runs/<run_id>/metrics.jsonl` in its Pando run folder
      (hypothesis_workspace.record_tool_metrics) -- append-only like log.jsonl,
      but neither the hash-chained log nor the managed run.json.
    failure: |
      Runtime failures are swallowed (missing wandb, absent API key, unreachable
      host): the exporter goes inert and never raises into the hook caller, so it
      cannot slow or break a running campaign. A malformed `metrics:` block is
      the exception and raises in loam_config, the way a bad `execution:` block
      does. Implementation: adapters/hermes/plugin/wandb_metrics.py.
