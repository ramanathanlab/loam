model:
  default: nemotron-3-ultra
  provider: custom:alcf-minerva-via-proxy-(localhost:51911)
  base_url: http://localhost:51911/v1
  api_key: local-no-auth   # scripts/alcf_inference_proxy.py injects the ALCF token
_config_version: 33
plugins:
  enabled:
    - loam-hooks
custom_providers:
  - name: ALCF Minerva via proxy (localhost:51911)
    base_url: http://localhost:51911/v1
    api_key: local-no-auth   # scripts/alcf_inference_proxy.py injects the ALCF token
    model: gpt-oss-120b
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
delegation:
  max_spawn_depth: 2
  orchestrator_enabled: true
  max_concurrent_children: 5
mcp_servers:
  # FALDA campaign memory (the reasoner's falda_remember / falda_recall). run-campaign exports the key
  # Loam minted and the pool. Keep the timeouts short: a slow FALDA must fail the call, not stall the agent.
  falda:
    url: https://falda.cairnscore.ai/mcp
    headers:
      Authorization: "Bearer ${FALDA_TOKEN}"
      X-Falda-Pool: "${FALDA_POOL}"
    timeout: 5
    connect_timeout: 5
  hpc:
    url: http://127.0.0.1:8000/mcp
    timeout: 900
    connect_timeout: 60
  hpcctl:                       # -> mcp__hpcctl__hpc_allocation_status / hpc_restart
    command: /Users/architvasan/.loam-venv-312/bin/python
    args: [
          /Users/architvasan/Desktop/Projects/Agentic_Crazy_Campaign/loam/skills/hpc-deployment/scripts/hpc_control.py]
    env:
      HPC_ENV_FILE: 
        /Users/architvasan/Desktop/Projects/Agentic_Crazy_Campaign/loam/skills/hpc-deployment/set_env_akv.sh
      HPC_ALLOWED_QUEUES: debug,debug-scaling,capacity
      HPC_MAX_NODES: "4"
      HPC_MAX_WALLTIME: "12:00:00"
    timeout: 300                # a restart waits up to 180 s for the old server to exit
approvals:
  mcp_reload_confirm: false

# Keep every tool eager. Hermes defers MCP tools behind tool_search once there are enough of them
# (FALDA adds eight), and Loam's role policies block tool_search for the code-generator, which then
# cannot reach the HPC run_code tool.
tools:
  tool_search:
    enabled: false
