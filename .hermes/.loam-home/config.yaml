model:
  default: argo:gpt-5.6-sol
  provider: custom
  base_url: http://localhost:50856/v1
  api_key: local-no-auth
_config_version: 33
plugins:
  enabled:
  - loam-hooks
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
delegation:
  max_spawn_depth: 2
  orchestrator_enabled: true
  max_concurrent_children: 5
  base_url: http://localhost:50856/v1
  api_key: local-no-auth
  model: argo:gpt-5.6-sol
mcp_servers:
  hpc:
    url: http://127.0.0.1:8000/mcp
    timeout: 900
    connect_timeout: 120
  hpcctl:
    command: /e/project1/deepwing/meigooni1/agent/software/globus-compute/.venv/bin/python
    args:
    - /e/project1/deepwing/meigooni1/agent/loam/skills/hpc-deployment/scripts/hpc_control.py
    env:
      HPC_ENV_FILE: /e/project1/deepwing/meigooni1/agent/loam/skills/hpc-deployment/set_env_jupiter.sh
      HPC_ALLOWED_QUEUES: booster,largebooster
      HPC_MAX_NODES: '1'
      HPC_MAX_WALLTIME: 00:30:00
      GLOBUS_COMPUTE_USER_DIR: /e/project1/deepwing/meigooni1/agent/software/globus-compute/endpoints
    timeout: 300
approvals:
  mcp_reload_confirm: false
custom_providers:
- name: Jupiter Argo tunnel
  base_url: http://localhost:50856/v1
  api_key: local-no-auth
  model: argo:gpt-5.6-sol
