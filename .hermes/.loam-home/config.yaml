model:
  default: argo:gpt-5.6-sol
  provider: custom
  base_url: http://localhost:50143/v1
  api_key: local-no-auth   # Argo proxy tunnel on :50143 (homes-02:50143 via cels-gw)
_config_version: 33
plugins:
  enabled:
    - loam-hooks
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
delegation:
  max_spawn_depth: 2
  orchestrator_enabled: true
  max_concurrent_children: 160
mcp_servers:
  hpc:
    url: http://127.0.0.1:8000/mcp
    timeout: 900
    connect_timeout: 120
  hpcctl:                       # -> mcp__hpcctl__hpc_allocation_status / hpc_restart
    command: /ritom/scratch/cscs/avasan/loam_venv/bin/python
    args: [
          /ritom/scratch/cscs/avasan/loam/skills/hpc-deployment/scripts/hpc_control.py]
    env:
      HPC_ENV_FILE:
        /ritom/scratch/cscs/avasan/loam/skills/hpc-deployment/set_env_cscs.sh
      # Alps SLURM partitions. hpc_control.QUEUE_LIMITS only knows the Aurora
      # queues, so 'normal'/'low' fall back to the HPC_MAX_* caps below; 'debug'
      # inherits Aurora's 2-node/1h cap there (harmless -- affects only the
      # hpcctl restart tool, not the core mcp_server submission path).
      HPC_ALLOWED_QUEUES: debug,low,normal
      HPC_MAX_NODES: "8"
      # Caps checked by hpc_control.validate() for the hpcctl restart tool.
      # normal/low allow 24 h on Alps; keep the cap there.
      HPC_MAX_WALLTIME: "24:00:00"
    timeout: 300                # a restart waits up to 180 s for the old server to exit
approvals:
  mcp_reload_confirm: false
# Pre-record the shared-metrics consent so a driven (PTY) campaign is not blocked
# on the first-run "Help improve Hermes?" prompt. decided + offer_version=2 =>
# offer_consent_if_undecided() returns without prompting. (No telemetry is sent.)
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
